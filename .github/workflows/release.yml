name: Release

# A v* tag builds the macOS archives and publishes the GitHub Release with them.
# Tags with "-" are prereleases and leave the tap alone; any other tag also
# writes packaging/homebrew/tea.rb, filled in, to soundadam/homebrew-tap.
# A manual run only builds and keeps the archives as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=0.0.0-dev.$(git rev-parse --short HEAD)
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Release tag has a CHANGELOG entry
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: grep -qF "## [$VERSION]" CHANGELOG.md

      - run: go test ./...

      - run: scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Packaged executable reports the tag version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            tar -C "$RUNNER_TEMP" -xzf "dist/tea-$VERSION-macos-$arch.tar.gz"
            codesign --verify --verbose=2 "$RUNNER_TEMP/tea-$VERSION-macos-$arch/tea"
          done
          native=$(uname -m)
          [[ $native == arm64 ]] && native=aarch64
          test "$("$RUNNER_TEMP/tea-$VERSION-macos-$native/tea" version)" = "tea $VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The repository has immutable releases: assets go up with the create
      # call, before the release is published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          flags=(--notes-file notes.md)
          [[ -s notes.md ]] || flags=(--generate-notes)
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "tea $VERSION" "${flags[@]}"

  # HOMEBREW_TAP_GITHUB_TOKEN: fine-grained token, repository soundadam/homebrew-tap
  # only, "Contents: read and write". The workflow's own token cannot push to
  # another repository.
  homebrew:
    needs: [package, release]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Render the Cask
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          sha() { sha256sum "dist/tea-$VERSION-macos-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$VERSION/" \
            -e "s/@MACOS_AARCH64_SHA256@/$(sha aarch64)/" \
            -e "s/@MACOS_X86_64_SHA256@/$(sha x86_64)/" \
            packaging/homebrew/tea.rb >tea.rb
          ! grep -n '@[A-Z0-9_]*@' tea.rb

      - name: Push to soundadam/homebrew-tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set"; exit 1; }
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/soundadam/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp tea.rb tap/Casks/tea.rb
          cd tap
          git add Casks/tea.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "tea $VERSION"
          git push origin HEAD:main
