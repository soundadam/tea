name: CI

on:
  push:
    branches:
      - main
      - "iteration/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Report toolchain
        run: |
          set -euo pipefail
          sw_vers
          go version

      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BASE_SHA" && "$BASE_SHA" != "$zero_sha" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff-tree --check --no-commit-id --root -r "$HEAD_SHA"
          fi

      - name: Check repository security invariants
        run: |
          set -euo pipefail

          secret_pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}'
          if git grep -nE -e "$secret_pattern" -- .; then
            echo "Potential credential material found in tracked files." >&2
            exit 1
          fi

          if git grep -nF 'sudo -k' -- internal cmd main.go; then
            echo "Production sources must not invalidate the sudo credential cache." >&2
            exit 1
          fi

      - name: Validate documentation
        run: python3 scripts/check-documentation.py

      - name: Run tests
        run: go test ./...

      - name: Package as the release does
        run: scripts/package.sh 0.0.0-ci

      - name: Smoke-test the packaged executable
        run: |
          set -euo pipefail
          native=$(uname -m)
          [[ $native == arm64 ]] && native=aarch64
          tar -C "$RUNNER_TEMP" -xzf "dist/tea-0.0.0-ci-macos-$native.tar.gz"
          tea="$RUNNER_TEMP/tea-0.0.0-ci-macos-$native/tea"
          test "$("$tea" version)" = "tea 0.0.0-ci"

          set +e
          helper_error=$("$tea" __tea_privileged version 2>&1)
          helper_status=$?
          set -e
          test "$helper_status" -eq 77
          grep -q 'privileged helper must run as root' <<<"$helper_error"

  # The branch ruleset requires this job alone. It passes when every job above
  # passed or was skipped, so adding a job here is the only change a new one needs.
  check:
    if: always()
    needs: [go]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
